<!-- ===================== PANEL 1: DATA SNAPSHOT ===================== -->
<div class="tabpanel active" id="tab-p1">
  <section>
    <h2>Snapshot Pasar</h2>
    <div class="chart-head" style="margin-bottom:12px">
      <label class="src">Bandingkan vs</label>
      <select id="snapshotPeriodSelect" style="width:auto">
        <option value="day">Hari</option>
        <option value="week">Minggu</option>
        <option value="month">Bulan</option>
        <option value="year">Tahun</option>
      </select>
    </div>
    <div id="cards"></div>
  </section>

  <section>
    <details id="flagsDetails" class="collapsible">
      <summary>Status Sumber Data (source_flags)</summary>
      <div class="panel">
        <div class="flags" id="flags"></div>
      </div>
    </details>
  </section>

  <section>
    <h2>Manual Backfill</h2>
    <div class="panel">
      <div class="form-grid">
        <div>
          <label class="field">Instrument</label>
          <select id="bfInstrument">
            <option>BTC</option><option>SP500</option><option>IHSG</option>
            <option>GOLD</option><option>USDIDR</option><option>USDJPY</option>
            <option>DXY</option><option>US10Y</option><option>VIX</option>
            <option>WALCL</option><option>RRP</option><option>TGA</option><option>HY</option>
          </select>
        </div>
        <div>
          <label class="field">Dari tanggal</label>
          <input type="date" id="bfFrom">
        </div>
        <div>
          <label class="field">Sampai tanggal</label>
          <input type="date" id="bfTo">
        </div>
      </div>
      <div id="bfGapInfo" class="src" style="margin-top:8px">Memuat info data...</div>
      <div class="form-row" style="margin-top:12px">
        <button class="btn secondary" id="bfPreviewBtn">Preview</button>
        <button class="btn" id="bfCommitBtn" style="display:none">Confirm &amp; Commit</button>
      </div>
      <div id="bfResult" class="src"></div>
    </div>
  </section>
</div>
